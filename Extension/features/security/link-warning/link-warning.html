<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Monitor — Suspicious site</title>
    <link rel="stylesheet" href="link-warning.css">
  </head>
  <body>
    <main class="warning-shell">
      <section class="warning-panel" aria-labelledby="warning-title" aria-describedby="warning-summary">
        <header class="warning-heading">
          <div class="signal" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 3.5 21 19H3L12 3.5Z"></path>
              <path class="signal-mark" d="M12 8.4v5.4m0 2.7v.1"></path>
            </svg>
          </div>
          <div>
            <p class="eyebrow">Browser Monitor</p>
            <h1 id="warning-title">Check the address</h1>
            <p class="summary" id="warning-summary">This destination has a risk signal. Make sure the address is the one you expect.</p>
          </div>
        </header>

        <div class="domain-card">
          <span id="destination-label">Destination</span>
          <strong id="destination-domain">unknown</strong>
          <small id="registrable-summary"></small>
        </div>

        <p id="cleaned-parameters" class="cleaned-note" hidden></p>

        <div class="actions">
          <button id="back-button" class="primary" type="button">Go back</button>
          <button id="continue-button" class="secondary" type="button">Continue once</button>
          <button id="allow-button" class="trusted" type="button">Trust and continue</button>
          <div class="more-actions">
            <button id="more-button" class="more-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" aria-label="More actions">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"/></svg>
            </button>
            <div id="more-menu" class="action-menu" role="menu" hidden>
              <div class="address-preview" role="presentation">
                <span id="full-address-label">Full address</span>
                <code id="destination-url"></code>
              </div>
              <button id="copy-clean-button" type="button" role="menuitem">Copy clean link</button>
              <button id="block-button" class="danger" type="button" role="menuitem">Block domain</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="link-warning.js"></script>
  </body>
</html>
