<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Monitor — Suspicious site</title>
    <link rel="stylesheet" href="link-warning.css">
  </head>
  <body>
    <main class="warning-shell">
      <section class="warning-panel" aria-labelledby="warning-title" aria-describedby="warning-summary">
        <div class="signal" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 3.5 21 19H3L12 3.5Z"></path>
            <path class="signal-mark" d="M12 8.4v5.4m0 2.7v.1"></path>
          </svg>
        </div>
        <h1 id="warning-title">Check this site before continuing</h1>
        <p class="summary" id="warning-summary">Check the address before you continue. Do not enter passwords, recovery phrases, payment details, or verification codes on a site you do not trust.</p>

        <dl class="domain-card">
          <div>
            <dt>You are opening</dt>
            <dd id="destination-domain">unknown</dd>
          </div>
        </dl>

        <details class="details">
          <summary>Show full address</summary>
          <label>
            Full destination URL
            <textarea id="destination-url" readonly rows="4"></textarea>
          </label>
        </details>

        <div class="actions">
          <button id="back-button" class="primary" type="button">Go back</button>
          <button id="continue-button" class="secondary" type="button">Continue once</button>
          <button id="allow-button" class="tertiary" type="button">Trust this domain and continue</button>
        </div>
      </section>
    </main>
    <script type="module" src="link-warning.js"></script>
  </body>
</html>
