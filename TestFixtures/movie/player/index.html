<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:type" content="video.episode">
    <meta property="og:title" content="Example Show — Episode 4 | Watch online">
    <title>Example Show — Episode 4 | Watch online</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: #101314;
        color: #f2f4f3;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1040px, calc(100% - 48px)); margin: 42px auto; }
      .eyebrow { color: #8eb49b; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 7px 0 22px; font-size: 30px; }
      .video-player {
        overflow: hidden;
        position: relative;
        width: 960px;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #303638;
        border-radius: 18px;
        background: linear-gradient(135deg, #263230, #111718 65%);
        box-shadow: 0 24px 70px rgb(0 0 0 / 35%);
      }
      video { display: block; width: 100%; height: 100%; outline: none; }
      .fixture-note { margin-top: 16px; color: #8f989b; }
    </style>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"TVEpisode","name":"Example Show — Episode 4"}
    </script>
  </head>
  <body>
    <main>
      <div class="eyebrow">Continue Watching · local E2E fixture</div>
      <h1>Example Show — Episode 4</h1>
      <div class="video-player" data-player>
        <video controls preload="metadata" tabindex="0" width="960" height="540">
          <source src="fixture.mp4" type="video/mp4">
        </video>
      </div>
      <p class="fixture-note">Тестовая страница использует только локальный ролик и не отправляет данные наружу.</p>
    </main>
  </body>
</html>
