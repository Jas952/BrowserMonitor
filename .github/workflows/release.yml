name: Release Browser Monitor

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p 'require("./Extension/manifest.json").version')"
          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match extension version $MANIFEST_VERSION."
            exit 1
          fi

      - name: Test extension
        run: npm --prefix Extension test

      - name: Test macOS companion
        run: swift test --package-path MacApp

      - name: Build extension archive
        run: node script/build_release.mjs

      - name: Build macOS disk image
        env:
          BROWSER_MONITOR_VERSION: ${{ github.ref_name }}
          BROWSER_MONITOR_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BROWSER_MONITOR_VERSION="${BROWSER_MONITOR_VERSION#v}" \
            ./script/package_macos_release.sh
          shasum -a 256 dist/BrowserMonitor.dmg >> dist/SHA256SUMS.txt

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/sparkle-release"
          cp dist/BrowserMonitor.dmg "$RUNNER_TEMP/sparkle-release/"
          cp docs/knowledge/NextRelease.md "$RUNNER_TEMP/sparkle-release/BrowserMonitor.md"
          APPCAST_TOOL="$(find MacApp/.build/artifacts -type f -name generate_appcast -print -quit)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$APPCAST_TOOL" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/Jas952/BrowserMonitor/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/Jas952/BrowserMonitor" \
            --embed-release-notes \
            -o appcast.xml \
            "$RUNNER_TEMP/sparkle-release"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXTENSION_ARCHIVE="dist/browser-monitor-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$EXTENSION_ARCHIVE" dist/BrowserMonitor.dmg dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Browser Monitor $VERSION" \
              --notes-file docs/knowledge/NextRelease.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "$EXTENSION_ARCHIVE" dist/BrowserMonitor.dmg dist/SHA256SUMS.txt \
              --title "Browser Monitor $VERSION" \
              --notes-file docs/knowledge/NextRelease.md \
              --verify-tag
          fi

      - name: Publish appcast on main
        run: |
          cp appcast.xml "$RUNNER_TEMP/appcast.xml"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add appcast.xml
          git diff --cached --quiet || git commit -m "Update appcast for $GITHUB_REF_NAME"
          git push origin main
